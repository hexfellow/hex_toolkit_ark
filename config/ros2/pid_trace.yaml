pid_trace:
  ros__parameters:
    # rate
    rate_ros: 200.0
    rate_odom: 100.0

    # model
    model_base: "base_link"
    model_odom: "odom"

    # limit
    limit_vel:
      # [vel_norm, omega]
      - 1.0
      - 2.00
    limit_acc:
      # [acc_norm, alpha]
      - 10.0
      - 10.0

    # obs
    obs_weights: # weights of observation
      - 0.3
      - 0.3
      - 0.3
      - 0.3

    # trace
    trace_pid:
      # [kp_x, kp_yaw]
      # [ki_x, ki_yaw]
      # [kd_x, kd_yaw]
      - "[100.0, 100.0]"
      - "[0.0, 0.0]"
      - "[30.0, 40.0]"
    trace_err_limit:
      # [pos_err, yaw_err]
      - 0.5
      - 2.0
    trace_switch_dist: 0.2
